<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parktor — Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <style>body { display: none; }</style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- SIDEBAR -->
  <aside class="sb" id="sb">
    <div class="sb-logo">
      <div class="sb-logo-ico">P</div>
      <div>
        <div class="sb-logo-n">PARKTOR</div>
        <div class="sb-logo-s">Gestão Digital</div>
      </div>
    </div>
    <div class="sb-perf">
      <div class="sb-av" id="sb-av-sidebar">A</div>
      <div>
        <div class="sb-nome" id="userNameSidebar">Admin</div>
        <div class="sb-eq" id="userRoleSidebar">Administrador</div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="sb-sec">Principal</div>
      <a href="dashboard.html" class="si">
        <span class="si-i"><i data-lucide="layout-dashboard"></i></span>
        <span class="si-l">Dashboard</span>
      </a>
      <!-- Links Operacionais (Ocultos para Admin via JS) -->
      <div id="navOperacional">
        <a href="entrada.html" class="si" id="navEntrada">
          <span class="si-i"><i data-lucide="log-in"></i></span>
          <span class="si-l">Nova Entrada</span>
        </a>
        <a href="saida.html" class="si" id="navSaida">
          <span class="si-i"><i data-lucide="log-out"></i></span>
          <span class="si-l">Registrar Saída</span>
        </a>
      </div>

      <div id="navGestao">
        <div class="sb-sec">Gestão</div>
        <a href="financeiro.html" class="si active">
          <span class="si-i"><i data-lucide="wallet"></i></span>
          <span class="si-l">Financeiro</span>
        </a>
        <a href="relatorios.html" class="si">
          <span class="si-i"><i data-lucide="bar-chart-3"></i></span>
          <span class="si-l">Relatórios</span>
        </a>
        <a href="mensalistas.html" class="si">
          <span class="si-i"><i data-lucide="calendar-days"></i></span>
          <span class="si-l">Mensalistas</span>
        </a>
        <a href="config.html" class="si">
          <span class="si-i"><i data-lucide="settings"></i></span>
          <span class="si-l">Configurações</span>
        </a>
      </div>
    </nav>
    <div class="sb-ft">
      <div class="si si-logout" onclick="logout()">
        <span class="si-i"><i data-lucide="door-open"></i></span>
        <span class="si-l">Sair</span>
      </div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="cnt">
    <header class="topbar">
      <div class="tb-e">
        <button class="bhb" onclick="openMenu()"><i data-lucide="menu"></i></button>
        <div class="tb-t">Financeiro</div>
      </div>
      <div class="tb-d">
        <div class="tb-av" id="tb-av-top">A</div>
      </div>
    </header>

    <div class="pg">
      <div class="balance-hero anim-fadeInUp">
        <div class="slb">Saldo Hoje</div>
        <div class="balance-val" id="totalDay">R$ 0,00</div>
        <div class="mini-grid">
          <div class="mini-box"><div class="mini-label">Dinheiro</div><div class="mini-val" id="totalDinheiro">R$ 0</div></div>
          <div class="mini-box"><div class="mini-label">PIX/Cartão</div><div class="mini-val" id="totalDigital">R$ 0</div></div>
        </div>
      </div>

      <div class="card anim-fadeInUp">
        <div class="card-header"><h3 class="card-title">Últimas Saídas</h3></div>
        <div id="transList">
          <div style="padding: 40px; text-align: center; color: var(--text-muted);">Carregando lançamentos...</div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bnav">
    <div class="bnis">
      <a href="dashboard.html" class="bni">
        <span class="bnico"><i data-lucide="layout-dashboard"></i></span>
        <span class="bnlb">Dash</span>
      </a>
      <a href="financeiro.html" class="bni active">
        <span class="bnico"><i data-lucide="wallet"></i></span>
        <span class="bnlb">Financ</span>
      </a>
      <a href="config.html" class="bni">
        <span class="bnico"><i data-lucide="settings"></i></span>
        <span class="bnlb">Config</span>
      </a>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://oncrmxipujcydzggxdks.supabase.co', SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uY3JteGlwdWpjeWR6Z2d4ZGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUzMjcsImV4cCI6MjA5NDg5MTMyN30.8DB7OHZoV6fd8lmnWAQEwKO6BV6E_TltI6oH20Dhff4';
    const { createClient } = supabase; const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, tenantId = null;

    function openMenu() { document.getElementById('sb').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
    function closeMenu() { document.getElementById('sb').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      const { data: user, error } = await sb.from('users').select('*').eq('id', session.user.id).single();
      
      if (error || (user.nivel_acesso !== 'admin' && user.nivel_acesso !== 'root')) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = user; tenantId = user.tenant_id;
      
      // AJUSTE SIDEBAR ADMIN (PATCH 1.2.1)
      if (user.nivel_acesso === 'admin' || user.nivel_acesso === 'root') {
        document.getElementById('navOperacional')?.remove();
      }

      document.getElementById('userNameSidebar').textContent = user.nome.split(' ')[0];
      document.getElementById('userRoleSidebar').textContent = user.nivel_acesso.toUpperCase();
      document.getElementById('sb-av-sidebar').textContent = user.nome[0];
      document.getElementById('tb-av-top').textContent = user.nome[0];
      
      document.body.style.display = 'block';
      loadFinance();
    }

    async function loadFinance() {
      const hoje = new Date().toISOString().split('T')[0];
      const { data: resumo } = await sb.from('v_resumo_dia').select('*').eq('tenant_id', tenantId).eq('data', hoje).single();
      
      if (resumo) {
        document.getElementById('totalDay').textContent = `R$ ${resumo.total_faturado.toFixed(2).replace('.', ',')}`;
        document.getElementById('totalDinheiro').textContent = `R$ ${resumo.total_dinheiro.toFixed(0)}`;
        document.getElementById('totalDigital').textContent = `R$ ${(resumo.total_pix + resumo.total_cartao).toFixed(0)}`;
      }

      const { data: list } = await sb.from('valet_entries')
        .select('*')
        .eq('tenant_id', tenantId)
        .eq('status', 'finalizado')
        .gte('saida', hoje + 'T00:00:00')
        .lte('saida', hoje + 'T23:59:59')
        .order('saida', { ascending: false })
        .limit(20);
      const listEl = document.getElementById('transList');
      if (!list || list.length === 0) { listEl.innerHTML = '<div class="empty-state">Nenhum lançamento hoje</div>'; return; }
      
      listEl.innerHTML = list.map(t => `
        <div class="trans-item">
          <div class="trans-ico ico-in"><i data-lucide="arrow-down-left"></i></div>
          <div class="trans-info">
            <div class="trans-tit">Saída: ${t.placa}</div>
            <div class="trans-dat">${new Date(t.saida).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} — ${t.forma_pagamento.toUpperCase()}</div>
          </div>
          <div class="trans-val green">+ R$ ${t.valor.toFixed(2)}</div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function logout() { await sb.auth.signOut(); window.location.href = 'index.html'; }
    
    init();
    lucide.createIcons();
  </script>
</body>
</html>
