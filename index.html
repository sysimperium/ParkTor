<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parktor — Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="imgs/logoP.ico">
  <link rel="apple-touch-icon" href="imgs/logoP.ico">
  <link rel="manifest" href="manifest.json?v=2">
</head>
<body>

  <main class="login-page">
    <div class="login-container">
      
      <div class="login-logo">
        <img src="imgs/logo.png" alt="PARKTOR — Gestão de Estacionamento">
      </div>

      <div class="login-card">
        <h1 class="login-title">Bem-vindo</h1>
        <p class="login-subtitle">Acesse sua conta para continuar</p>

        <div class="alert alert-error" id="alertError">
          <span>Usuário ou senha incorretos.</span>
        </div>

        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label class="form-label">Usuário</label>
            <input type="text" id="usuario" class="form-input" placeholder="seu usuário" autocomplete="username" autocapitalize="none" autocorrect="off" required>
          </div>
          <div class="form-group">
            <label class="form-label">Senha</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="senha" class="form-input" placeholder="••••••••" required style="padding-right: 42px;">
              <button type="button" id="btnToggleSenha" class="btn btn-ghost" style="position: absolute; right: 4px; padding: 6px 10px; color: var(--text-secondary); background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 100%;" onclick="toggleSenha()" title="Mostrar ou ocultar senha">
                <i data-lucide="eye" id="iconToggleSenha" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="btnLogin">
            <span>ENTRAR NO SISTEMA</span>
          </button>
        </form>

        <div class="login-footer">
          <a href="#" onclick="openForgotModal(event)">Esqueci minha senha</a>
        </div>
      </div>

      <!-- MODAL ESQUECI MINHA SENHA -->
      <div class="modal-overlay" id="modalForgot" onclick="closeForgotModal()">
        <div class="modal" style="max-width: 400px; padding: 24px; position: relative;" onclick="event.stopPropagation()">
          <button type="button" class="btn btn-ghost" style="position: absolute; top: 12px; right: 12px; padding: 4px 8px; z-index: 10;" onclick="closeForgotModal()">
            <i data-lucide="x" style="width: 20px; height: 20px;"></i>
          </button>
          <h3 class="card-title" style="margin-bottom: 8px; font-family: var(--font-display); font-size: 1.25rem;">Recuperar Senha</h3>
          <p class="pg-s" style="margin-bottom: 20px; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4;">
            Digite o seu usuário ou o e-mail cadastrado. Um link de redefinição de senha será enviado para você.
          </p>

          <div class="alert alert-error" id="alertForgotError" style="display: none; margin-bottom: 15px; padding: 10px; border-radius: var(--radius-sm); font-size: 0.85rem;">
            <span>Erro ao processar solicitação.</span>
          </div>

          <div class="alert alert-success" id="alertForgotSuccess" style="display: none; margin-bottom: 15px; padding: 10px; border-radius: var(--radius-sm); font-size: 0.85rem; background: var(--success-bg); color: var(--green-300); border: 1px solid var(--border);">
            <span>E-mail enviado com sucesso.</span>
          </div>

          <form id="forgotForm" class="login-form">
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label">Usuário ou E-mail</label>
              <input type="text" id="forgotInput" class="form-input" placeholder="Ex: admin.central ou admin@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg" id="btnForgotSubmit">
              <span>ENVIAR E-MAIL DE RECUPERAÇÃO</span>
            </button>
          </form>
        </div>
      </div>

      <p class="login-version">
        PARKTOR v1.2 &mdash; 2026
      </p>

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://oncrmxipujcydzggxdks.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uY3JteGlwdWpjeWR6Z2d4ZGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUzMjcsImV4cCI6MjA5NDg5MTMyN30.8DB7OHZoV6fd8lmnWAQEwKO6BV6E_TltI6oH20Dhff4';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Cliente puro sem persistência em localStorage para consultas antes do login
    const sbAnon = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false }
    });

    const ROUTES = { root: 'root.html', admin: 'dashboard.html', operador: 'saida.html', manobrista: 'entrada.html' };

    async function rotearUsuario(userId) {
      const { data: user } = await sb.from('users').select('nivel_acesso, status, tenant_id').eq('id', userId).single();
      if (!user || user.status !== 'ativo') { await sb.auth.signOut(); return; }
      window.location.href = ROUTES[user.nivel_acesso] || 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const btn = document.getElementById('btnLogin');
      const alert = document.getElementById('alertError');

      alert.classList.remove('show');
      btn.classList.add('btn-loading');

      // 1. Buscar o e-mail associado ao username na tabela public.users
      const { data: userData, error: userError } = await sbAnon
        .from('users')
        .select('email')
        .ilike('username', usuario)
        .single();

      if (userError || !userData) {
        if (userError) console.error('Erro de login lookup:', userError);
        btn.classList.remove('btn-loading');
        alert.classList.add('show');
        return;
      }

      const email = userData.email;

      // 2. Autenticar usando o e-mail encontrado
      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

      if (error) {
        btn.classList.remove('btn-loading');
        alert.classList.add('show');
        return;
      }

      await rotearUsuario(data.user.id);
    });

    function toggleSenha() {
      const senhaInput = document.getElementById('senha');
      const icon = document.getElementById('iconToggleSenha');
      if (senhaInput.type === 'password') {
        senhaInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        senhaInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Lógica para o modal de "Esqueci minha senha"
    function openForgotModal(e) {
      if (e) e.preventDefault();
      document.getElementById('modalForgot').classList.add('show');
      document.getElementById('forgotInput').value = '';
      document.getElementById('alertForgotError').style.display = 'none';
      document.getElementById('alertForgotSuccess').style.display = 'none';
    }

    function closeForgotModal() {
      document.getElementById('modalForgot').classList.remove('show');
    }

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputVal = document.getElementById('forgotInput').value.trim();
      const btn = document.getElementById('btnForgotSubmit');
      const alertErr = document.getElementById('alertForgotError');
      const alertSucc = document.getElementById('alertForgotSuccess');

      alertErr.style.display = 'none';
      alertSucc.style.display = 'none';
      btn.classList.add('btn-loading');

      try {
        let email = '';
        
        // Se contiver '@', assumimos que é e-mail
        if (inputVal.includes('@')) {
          // Validar se existe o e-mail na base de dados
          const { data: userData, error: userError } = await sbAnon
            .from('users')
            .select('email')
            .ilike('email', inputVal)
            .single();
          
          if (userError) {
            console.error('Erro na consulta por e-mail:', userError);
            throw new Error('Erro na consulta ao banco: ' + userError.message);
          }
          if (!userData) {
            throw new Error('E-mail não cadastrado no sistema.');
          }
          email = userData.email;
        } else {
          // Procurar o username
          const { data: userData, error: userError } = await sbAnon
            .from('users')
            .select('email')
            .ilike('username', inputVal)
            .single();

          if (userError) {
            console.error('Erro na consulta por usuário:', userError);
            throw new Error('Erro na consulta ao banco: ' + userError.message);
          }
          if (!userData) {
            throw new Error('Usuário não cadastrado no sistema.');
          }
          email = userData.email;
        }

        // Enviar e-mail de recuperação
        let baseUrl = window.location.href.split('?')[0].split('#')[0];
        if (baseUrl.endsWith('/')) {
          baseUrl += 'recuperar-senha.html';
        } else if (baseUrl.endsWith('/index.html')) {
          baseUrl = baseUrl.replace('/index.html', '/recuperar-senha.html');
        } else {
          baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/')) + '/recuperar-senha.html';
        }

        const { error: resetError } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: baseUrl
        });

        if (resetError) {
          throw resetError;
        }

        alertSucc.querySelector('span').textContent = 'E-mail de recuperação enviado! Verifique sua caixa de entrada para redefinir sua senha.';
        alertSucc.style.display = 'block';
        document.getElementById('forgotInput').value = '';
      } catch (err) {
        console.error(err);
        alertErr.querySelector('span').textContent = err.message || 'Erro ao processar a solicitação.';
        alertErr.style.display = 'block';
      } finally {
        btn.classList.remove('btn-loading');
      }
    });

    lucide.createIcons();
  </script>

</body>
</html>
