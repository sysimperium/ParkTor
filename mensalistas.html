<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parktor — Mensalistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <style>body { display: none; }</style>
  <link rel="icon" type="image/x-icon" href="imgs/logoP.ico">
  <link rel="apple-touch-icon" href="imgs/logoP.ico">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- SIDEBAR -->
  <aside class="sb" id="sb">
    <div class="sb-logo">
      <div class="sb-logo-ico"><img src="imgs/logoP.ico" style="width: 100%; height: 100%; object-fit: contain;"></div>
      <div>
        <div class="sb-logo-n">PARKTOR</div>
        <div class="sb-logo-s">Gestão Digital</div>
      </div>
    </div>

    <div class="sb-tenant-info" style="margin-top: 15px; padding: 10px; border-radius: 12px; background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.05); text-align: center;">
      <div style="width: 60px; height: 60px; margin: 0 auto 8px auto; border-radius: 8px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center;">
        <img id="sb-tenant-logo" src="imgs/SuaMarcaAqui.png" style="max-width: 100%; max-height: 100%; object-fit: contain;">
      </div>
      <div id="sb-tenant-name" style="font-size: 0.8rem; font-weight: 700; color: var(--gold-400); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">...</div>
    </div>
    <div class="sb-perf">
      <div class="sb-av" id="sb-av-sidebar">A</div>
      <div>
        <div class="sb-nome" id="userNameSidebar">Admin</div>
        <div class="sb-eq" id="userRoleSidebar">Administrador</div>
      </div>
    </div>
    <nav class="sb-nav">
      <div id="navDashboard">
        <div class="sb-sec">Principal</div>
        <a href="dashboard.html" class="si" id="linkDashboard">
          <span class="si-i"><i data-lucide="layout-dashboard"></i></span>
          <span class="si-l">Dashboard</span>
        </a>
      </div>

      <div id="navOperacional">
        <div class="sb-sec">Operacional</div>
        <a href="entrada.html" class="si" id="navEntrada">
          <span class="si-i"><i data-lucide="log-in"></i></span>
          <span class="si-l">Nova Entrada</span>
        </a>
        <a href="saida.html" class="si" id="navSaida">
          <span class="si-i"><i data-lucide="log-out"></i></span>
          <span class="si-l">Registrar Saída</span>
        </a>
      </div>

      <div id="navGestao">
        <div class="sb-sec">Gestão</div>
        <a href="financeiro.html" class="si" id="navFinanceiro">
          <span class="si-i"><i data-lucide="wallet"></i></span>
          <span class="si-l">Financeiro</span>
        </a>
        <a href="checklist.html" class="si" id="navChecklist">
          <span class="si-i"><i data-lucide="clipboard-check"></i></span>
          <span class="si-l">Checklists</span>
        </a>
        <a href="relatorios.html" class="si" id="navRelatorios">
          <span class="si-i"><i data-lucide="bar-chart-3"></i></span>
          <span class="si-l">Relatórios</span>
        </a>
        <a href="mensalistas.html" class="si active" id="navMensalistas">
          <span class="si-i"><i data-lucide="calendar-days"></i></span>
          <span class="si-l">Mensalistas</span>
        </a>
        <a href="config.html" class="si" id="navConfig">
          <span class="si-i"><i data-lucide="settings"></i></span>
          <span class="si-l">Configurações</span>
        </a>
      </div>
    </nav>
    <div class="sb-ft">
      <div class="si si-logout" onclick="logout()">
        <span class="si-i"><i data-lucide="door-open"></i></span>
        <span class="si-l">Sair</span>
      </div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="cnt">
    <header class="topbar">
      <div class="tb-e">
        <button class="bhb" onclick="openMenu()"><i data-lucide="menu"></i></button>
        <div class="tb-t">Mensalistas</div>
      </div>
      <div class="tb-d">
        <div class="tb-av" id="tb-av-top">A</div>
      </div>
    </header>

    <div class="pg">
      <div class="card anim-fadeInUp" style="min-height: 300px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; text-align: center;">
        <div style="width: 80px; height: 80px; background: var(--bg-body); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold-400);">
            <i data-lucide="construction" size="40"></i>
        </div>
        <div>
            <h2 class="pg-t">Em Desenvolvimento.</h2>
            <p class="pg-s">Estamos preparando esta funcionalidade para você.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- BOTTOM NAV (Mobile) -->
  <nav class="bnav">
    <div class="bnis">
      <a href="dashboard.html" class="bni" id="mobNavDash">
        <span class="bnico"><i data-lucide="layout-dashboard"></i></span>
        <span class="bnlb">Dash</span>
      </a>
      <a href="entrada.html" class="bni" id="mobNavEntrada">
        <span class="bnico"><i data-lucide="log-in"></i></span>
        <span class="bnlb">Entrada</span>
      </a>
      <a href="saida.html" class="bni" id="mobNavSaida">
        <span class="bnico"><i data-lucide="log-out"></i></span>
        <span class="bnlb">Saída</span>
      </a>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://oncrmxipujcydzggxdks.supabase.co', SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uY3JteGlwdWpjeWR6Z2d4ZGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUzMjcsImV4cCI6MjA5NDg5MTMyN30.8DB7OHZoV6fd8lmnWAQEwKO6BV6E_TltI6oH20Dhff4';
    const { createClient } = supabase; const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, tenantId = null;

    function openMenu() { document.getElementById('sb').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
    function closeMenu() { document.getElementById('sb').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }

    async function init() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        const { data: user, error } = await sb.from('users').select('*, tenants(*)').eq('id', session.user.id).single();
        
        if (error || !user) { window.location.href = 'index.html'; return; }

        currentUser = user; tenantId = user.tenant_id;

        // CONTROLE DE VISIBILIDADE DA SIDEBAR (STRICT)
        if (user.nivel_acesso === 'manobrista') {
          document.getElementById('navDashboard')?.remove();
          document.getElementById('navSaida')?.remove();
          document.getElementById('navGestao')?.remove();
          document.getElementById('mobNavDash')?.remove();
          document.getElementById('mobNavSaida')?.remove();
        } else if (user.nivel_acesso === 'operador') {
          document.getElementById('navDashboard')?.remove();
          document.getElementById('navEntrada')?.remove();
          document.getElementById('navGestao')?.remove();
          document.getElementById('mobNavDash')?.remove();
          document.getElementById('mobNavEntrada')?.remove();
        }

        const firstName = user.nome.split(' ')[0];
        document.getElementById('userNameSidebar').textContent = firstName;
        document.getElementById('userRoleSidebar').textContent = user.nivel_acesso.toUpperCase();
        document.getElementById('sb-av-sidebar').textContent = firstName[0];
        document.getElementById('tb-av-top').textContent = firstName[0];
        
        if (currentUser.tenants) {
          document.getElementById('sb-tenant-name').textContent = currentUser.tenants.nome;
          if (currentUser.tenants.logo_url) {
            document.getElementById('sb-tenant-logo').src = currentUser.tenants.logo_url;
          }
        }
      } catch (err) {
        console.error("Erro no init:", err);
      } finally {
        document.body.style.display = 'block';
      }
    }

    async function logout() { await sb.auth.signOut(); window.location.href = 'index.html'; }
    
    init();
    lucide.createIcons();
  </script>
</body>
</html>
